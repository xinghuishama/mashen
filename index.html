<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神码再现 · 杀码助手 v3.5.3</title>
    <link rel="stylesheet" href="style.css">
    <script src="data.js"></script>
</head>
<body class="mech-grid">
    <div class="max-w-2xl mx-auto p-4">
        <!-- 标题 -->
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold text-cyan-400">神码再现</h1>
            <p class="text-gray-400">命中衰减 · 频次动态调整 · 独苗守护</p>
        </div>

        <!-- 输入区 -->
        <div class="bg-[#1a1a2a] rounded-2xl p-5 mb-6 border border-cyan-500/20">
            <textarea id="numbers" rows="5" class="w-full bg-[#0f0f1a] border border-cyan-500/30 rounded-xl p-4 text-white font-mono text-sm resize-y" 
                      placeholder="输入号码或生肖，例如：龙蛇马 12 25 36 8 17..."></textarea>
            
            <div class="flex gap-3 mt-4">
                <button id="exampleBtn" class="flex-1 py-3 bg-gray-800 hover:bg-gray-700 rounded-xl text-white">示例数据</button>
                <button id="clearBtn" class="flex-1 py-3 bg-gray-800 hover:bg-gray-700 rounded-xl text-white">清除</button>
            </div>
            
            <div class="flex justify-between text-sm mt-3">
                <span>有效号码: <strong id="charCount" class="text-cyan-400">0</strong></span>
                <span id="numberWarn" class="hidden text-amber-400">⚠️ 已截断至5000个</span>
            </div>
        </div>

        <!-- 分析结果 -->
        <div class="bg-[#1a1a2a] rounded-2xl p-5 mb-6 border border-cyan-500/20">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">分析结果</h2>
                <button id="copyResultBtn" class="px-5 py-2 bg-cyan-600 hover:bg-cyan-500 rounded-xl text-sm">复制结果</button>
            </div>
            <div id="result" class="min-h-[300px]"></div>
        </div>

        <!-- 当前开奖 -->
        <div class="bg-[#1a1a2a] rounded-2xl p-5 border border-cyan-500/20">
            <div class="flex justify-between mb-3">
                <span id="lotteryPeriod" class="text-2xl font-bold text-white">-- 期</span>
                <button id="refreshLotteryBtn" class="px-6 py-2 bg-orange-500 hover:bg-orange-400 rounded-full text-white text-sm font-medium">刷新开奖</button>
            </div>
            <div id="lotteryTime" class="text-xs text-gray-400 mb-4"></div>
            <div id="lotteryBalls" class="result-balls-row"></div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-grid">
            <div class="nav-item" data-drawer="shama">杀码</div>
            <div class="nav-item" data-drawer="shengxiao">生肖</div>
            <div class="nav-item" data-drawer="haomatou">头数</div>
            <div class="nav-item" data-drawer="weishu">尾数</div>
            <div class="nav-item" data-drawer="shuduan">数段</div>
            <div class="nav-item" data-drawer="bose">波色</div>
            <div class="nav-item" data-drawer="wuxing">五行</div>
            <div class="nav-item" data-drawer="bandanshuang">半单双</div>
            <div class="nav-item" data-drawer="heshu">合数</div>
            <div class="nav-item" data-drawer="history">历史</div>
            <div class="nav-item" data-drawer="live">直播</div>
            <div class="nav-item" data-drawer="selectnone">清空</div>
        </div>
    </div>

    <!-- 抽屉 -->
    <div id="drawer-overlay" class="drawer-overlay hidden"></div>
    <div id="drawer-container" class="drawer-mobile">
        <div class="drawer-header">
            <h3 id="drawer-title">筛选器</h3>
            <button id="drawer-close">✕</button>
        </div>
        <div id="drawer-content"></div>
    </div>

    <div id="toast" class="toast">操作成功</div>

    <script src="worker.js"></script>
    <script src="app.js"></script>
</body>
</html>
