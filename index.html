<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>神码再现 · 杀码助手 v3.5.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="mech-grid text-gray-300 overflow-x-hidden">
    <div class="max-w-2xl mx-auto p-4">
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold text-cyan-400">神码再现</h1>
            <p class="text-gray-400">命中衰减 · 频次动态调整 · 独苗守护 · 0次统计</p>
        </div>

        <div class="bg-[#1a1a2a] rounded-2xl p-5 mb-6 border border-cyan-500/20">
            <textarea id="numbers" rows="5" maxlength="30000" class="w-full bg-[#0f0f1a] border border-cyan-500/30 rounded-xl p-4 text-white font-mono text-sm resize-y" 
                      placeholder="输入号码或生肖，例如：龙蛇马 12 25 36 8 17..."></textarea>
            <div class="flex gap-3 mt-4">
                <button id="exampleBtn" class="flex-1 py-3 bg-gray-800 hover:bg-gray-700 rounded-xl text-white font-semibold transition-all active:scale-95">示例数据</button>
                <button id="clearBtn" class="flex-1 py-3 bg-gray-800 hover:bg-gray-700 rounded-xl text-white font-semibold transition-all active:scale-95">清除输入</button>
            </div>
            <div class="flex justify-between text-sm mt-3 font-mono">
                <span class="text-gray-500">智能分析引擎 <span class="text-emerald-400 text-xs">(防抖200ms · 上限5000个 · Worker+主线程双保险)</span></span>
                <div class="flex gap-3">
                    <span>有效: <strong id="charCount" class="text-cyan-400">0</strong></span>
                    <span id="numberWarn" class="hidden text-red-400">⚠️ 已截断至5000个</span>
                </div>
            </div>
        </div>

        <div class="bg-[#1a1a2a] rounded-2xl p-5 mb-6 border border-cyan-500/20">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold bg-gradient-to-r from-cyan-400 to-pink-500 bg-clip-text text-transparent">分析结果</h2>
                <button id="copyResultBtn" class="px-5 py-2 bg-gradient-to-r from-emerald-500 to-emerald-700 hover:shadow-lg rounded-xl text-sm font-bold text-black transition-all active:scale-95 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 16 16"><path d="M4 2v12h8v2H2V2h2zm10 0v12h2V2h-2zm-2 0H6v12h6V2z"/></svg>复制结果
                </button>
            </div>
            <div id="result" class="min-h-[300px]">
                <div class="flex flex-col items-center justify-center py-12 text-gray-500">
                    <svg class="w-20 h-20 mb-4 opacity-50" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" stroke="#00ffea" stroke-width="2" fill="none" stroke-dasharray="5,5"/><path d="M30 50l15 15 25-30" stroke="#00ffea" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
                    <p>输入号码启动分析</p>
                </div>
            </div>
        </div>

        <div class="lottery-card">
            <div class="flex justify-between items-start mb-4">
                <div><div class="text-gray-400 text-sm mb-1">第 <span id="lotteryPeriod" class="text-gray-300">--</span> 期</div></div>
                <div class="text-right">
                    <div class="text-gray-400 text-sm mb-1">開獎時間</div>
                    <div id="lotteryTime" class="text-gray-300 text-sm">--</div>
                </div>
            </div>
            <div class="border-t border-gray-700/50 my-4"></div>
            <div id="lotteryBalls" class="flex justify-center flex-wrap gap-1"></div>
            <button id="refreshLotteryBtn" class="refresh-btn-orange">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>刷新数据
            </button>
        </div>

        <footer class="mt-6 text-center text-xs text-gray-600 tracking-widest pb-4">神码再现 · 杀码助手 v3.5.3</footer>
    </div>

    <nav class="bottom-nav">
        <div class="nav-grid">
            <button class="nav-item" data-drawer="shama">杀码</button>
            <button class="nav-item" data-drawer="shengxiao">生肖</button>
            <button class="nav-item" data-drawer="haomatou">头数</button>
            <button class="nav-item" data-drawer="weishu">尾数</button>
            <button class="nav-item" data-drawer="shuduan">数段</button>
            <button class="nav-item" data-drawer="bose">波色</button>
            <button class="nav-item" data-drawer="wuxing">五行</button>
            <button class="nav-item" data-drawer="bandanshuang">半单双</button>
            <button class="nav-item" data-drawer="heshu">合数</button>
            <button class="nav-item" data-drawer="history">历史</button>
            <button class="nav-item" data-drawer="live">直播</button>
            <button class="nav-item" data-drawer="selectnone">清空</button>
        </div>
    </nav>

    <div id="drawer-overlay" class="drawer-overlay hidden"></div>
    <div id="drawer-container" class="drawer-mobile">
        <div class="drawer-header">
            <h3 id="drawer-title">筛选器</h3>
            <button id="drawer-close">✕</button>
        </div>
        <div id="drawer-content"></div>
    </div>

    <div id="toast" class="toast">操作成功</div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
